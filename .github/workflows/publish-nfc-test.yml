name: Verify NFC test download

on:
  push:
    branches:
      - arena/bc544a20-khodaparast-card
    paths:
      - '.github/workflows/publish-nfc-test.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download both public assets without authentication
        shell: bash
        run: |
          set -euo pipefail
          base='https://github.com/RwinFu/khodaparast-card/releases/download/nfc-android-test-1'
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 --output "$RUNNER_TEMP/Majid-Khodaparast-NFC.apk" "$base/Majid-Khodaparast-NFC.apk"
          echo "a40414a3789de693d90947ba923035b310777905c49915d41d7ff99c56e4606b  $RUNNER_TEMP/Majid-Khodaparast-NFC.apk" | sha256sum --check
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 --output "$RUNNER_TEMP/Majid-Khodaparast-NFC.zip" "$base/Majid-Khodaparast-NFC.zip"
          echo "331a9c7d7b8bc76a5f40594181867b57f455ce638127c719242895324590be18  $RUNNER_TEMP/Majid-Khodaparast-NFC.zip" | sha256sum --check
          unzip -t "$RUNNER_TEMP/Majid-Khodaparast-NFC.zip"

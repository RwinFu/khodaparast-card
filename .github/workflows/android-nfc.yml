name: Build Android NFC card

on:
  push:
    branches:
      - main
      - arena/bc544a20-khodaparast-card
    paths:
      - 'android-nfc/**'
      - '.github/workflows/android-nfc.yml'
  pull_request:
    paths:
      - 'android-nfc/**'
      - '.github/workflows/android-nfc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Test and build the debug APK
        working-directory: android-nfc
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Majid-Khodaparast-NFC-debug
          path: android-nfc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
